version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SAHAYAK — Local Development Stack
#
# Services:
#   db       — PostgreSQL 16 (persistent volume)
#   mailhog  — Email capture UI (http://localhost:8025)
#   app      — Next.js application (http://localhost:3000)
#
# Usage:
#   docker compose up --build          # first start (runs migrations + seed)
#   docker compose up                  # subsequent starts
#   docker compose down -v             # destroy all data and restart fresh
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: sahayak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sahayak_mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahayak_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sahayak:sahayak_local_dev@db:5432/sahayak
      SESSION_SECRET: change-this-to-a-64-char-random-secret-in-production
      NEXTAUTH_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: noreply@sahayak.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      # Optional — leave empty to disable AI features
      GEMINI_API_KEY: ""
      # Experimental ML feature flag — disabled by default
      ENABLE_ML_FEATURES: "false"
      MIN_GROUP_SIZE: "10"
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
